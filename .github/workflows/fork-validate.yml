name: Fork validation

on:
  pull_request:
    branches: [fork-integration, "review/**"]
  push:
    branches: [fork-integration]
  workflow_dispatch:

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public base and stacked production branches
        run: |
          git remote add upstream https://github.com/Talon-One-Fighter-Squadron/Server-Panel.git
          git fetch upstream main
          git fetch origin \
            feature/01-server-scope:refs/remotes/origin/feature/01-server-scope \
            feature/02-jinja-components:refs/remotes/origin/feature/02-jinja-components \
            feature/03-mobile-confirm-diagnostics:refs/remotes/origin/feature/03-mobile-confirm-diagnostics
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fork_tools/package-lock.json
      - name: Install fork validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fork_tools/requirements-dev.txt
          npm ci --prefix fork_tools
      - name: Run complete fork PR gate
        run: >-
          python scripts/fork/validate-pr.py
          --base-ref origin/feature/02-jinja-components
          --feature-ref origin/feature/03-mobile-confirm-diagnostics
          --evidence-dir artifacts/pr3
          --browser-results after/validation-results.json
          --capture-script scripts/fork/capture-pr3.cjs
          --expected-browser-assertion shared-confirmation-dialog
          --expected-browser-assertion diagnostics-closed-default
          --expected-browser-assertion diagnostics-redacts-sensitive-values
          --expected-browser-assertion background-refresh-preserves-foreground-diagnostics
          --expected-browser-assertion desktop-drawer-toggle-hidden
          --expected-browser-assertion iphone-portrait-drawer-focus-escape
          --expected-browser-assertion iphone-landscape-drawer-focus-escape
          --expected-browser-assertion iphone-portrait-sticky-server-context
          --expected-browser-assertion iphone-landscape-sticky-server-context
          --expected-browser-assertion field-error-focus
          --expected-browser-assertion typed-confirmation-guards-destructive-request
          --expected-browser-assertion iphone-no-input-zoom
          --expected-browser-assertion natural-document-scroll
          --expected-browser-assertion desktop-overview-no-overflow
          --expected-browser-assertion desktop-settings-no-overflow
          --expected-browser-assertion large-desktop-overview-no-overflow
          --expected-browser-assertion large-desktop-settings-no-overflow
          --expected-browser-assertion iphone-portrait-overview-no-overflow
          --expected-browser-assertion iphone-portrait-settings-no-overflow
          --expected-browser-assertion iphone-landscape-overview-no-overflow
          --expected-browser-assertion iphone-landscape-settings-no-overflow
          --expected-viewport 1200x800
          --expected-viewport 1600x1000
          --expected-viewport 390x844
          --expected-viewport 844x390
          --require-screenshots
