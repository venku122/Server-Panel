name: Fork validation

on:
  pull_request:
    branches: [fork-integration, "review/**"]
  push:
    branches: [fork-integration]
  workflow_dispatch:

concurrency:
  group: fork-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public base and stacked production branches
        run: |
          git remote add upstream https://github.com/Talon-One-Fighter-Squadron/Server-Panel.git
          git fetch upstream main
          git fetch origin '+refs/heads/feature/*:refs/remotes/origin/feature/*'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: fork_tools/package-lock.json
      - name: Install fork validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fork_tools/requirements-dev.txt
          npm ci --prefix fork_tools
      - name: Run complete fork PR gate
        run: >-
          python scripts/fork/validate-pr.py
          --base-ref origin/feature/08-workshop-library
          --feature-ref origin/feature/09-moderation-module
          --capture-script scripts/fork/capture-pr8.cjs
