{% macro empty_state(title, message, action_label='', action_href='') -%}
    <section class="card empty-state">
        <h2>{{ title }}</h2>
        <p class="muted">{{ message }}</p>
        {% if action_label and action_href %}<a class="btn primary" href="{{ action_href }}">{{ action_label }}</a>{% endif %}
    </section>
{%- endmacro %}
